
<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3157d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juzi MIDI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>JuziSound MIDI kalkulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 14px;background:#f2f3f7;color:#171923;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:grid;place-items:center}
.card{width:100%;max-width:500px;background:white;border-radius:22px;padding:22px;box-shadow:0 8px 28px #18213b18}
h1{font-size:25px;margin:0 0 8px}
.sub,.note{color:#626779;font-size:14px;line-height:1.45}
label{display:block;font-weight:700;margin:20px 0 8px}
.display{min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:800;letter-spacing:2px;padding:10px;border:1px solid #bbc2d3;border-radius:13px;background:#fff;color:#171923}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.key{min-height:56px;border:0;border-radius:13px;padding:10px;font-size:24px;font-weight:750;background:#e8ecfa;color:#2345b5;touch-action:manipulation}
.key.utility{font-size:17px;background:#dce3f8}
.key.zero{grid-column:2}
.result{margin-top:17px;background:#eef2ff;border-radius:17px;padding:18px;text-align:center}
.caption{font-size:12px;font-weight:700;color:#555f7b}
.code{font-size:42px;font-weight:850;color:#2345b5;margin:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cell{background:white;border-radius:12px;padding:12px 4px}
.cell b{display:block;font-size:27px}
.cell span{font-size:11px;color:#626779}
.action{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:13px;background:#3157d5;color:white;font-size:16px;font-weight:700}
.secondary{background:#e8ecfa;color:#2345b5}
.error{color:#b42318;font-size:13px;min-height:18px;margin-top:6px}
.note{font-size:12px;margin-top:16px}
@media(prefers-color-scheme:dark){
body{background:#11131a;color:#f4f5f8}
.card{background:#20232d}
.sub,.note,.cell span{color:#b5bac9}
.display{background:#171a22;color:white;border-color:#51576a}
.key{background:#303b59;color:#d0dcff}
.key.utility{background:#3b4560}
.result{background:#202e55}
.caption{color:#c0cbed}
.code{color:#b9c9ff}
.cell{background:#292d39}
.secondary{background:#303b59;color:#d0dcff}
}
</style>
</head>
<body>
<main class="card">
<h1>JuziSound MIDI kalkulator</h1>
<p class="sub">Unesi broj preseta (0–9999) za Korg PA4X External.</p>
<label>Broj preseta</label>
<div class="display" id="preset" aria-live="polite">0</div>
<div class="error" id="error"></div>

<div class="keypad" id="keypad" aria-label="Numerička tastatura">
<button class="key" data-digit="1">1</button>
<button class="key" data-digit="2">2</button>
<button class="key" data-digit="3">3</button>
<button class="key" data-digit="4">4</button>
<button class="key" data-digit="5">5</button>
<button class="key" data-digit="6">6</button>
<button class="key" data-digit="7">7</button>
<button class="key" data-digit="8">8</button>
<button class="key" data-digit="9">9</button>
<button class="key utility" id="backspace" aria-label="Obriši posljednju cifru">⌫</button>
<button class="key zero" data-digit="0">0</button>
<button class="key utility" id="clear">C</button>
</div>

<button class="action secondary" id="done">Gotovo</button>
<button class="action secondary" id="showKeypad" hidden>Prikaži tastaturu</button>

<section class="result">
<div class="caption">MIDI poruka · MSB . LSB . Program</div>
<div class="code" id="combined">0.0.0</div>
<div class="grid">
<div class="cell"><b id="msb">0</b><span>1. pozicija · MSB</span></div>
<div class="cell"><b id="lsb">0</b><span>2. pozicija · LSB</span></div>
<div class="cell"><b id="pc">0</b><span>3. pozicija · Program</span></div>
</div>
</section>

<button class="action" id="copy">Kopiraj MIDI vrijednosti</button>
<button class="action secondary" id="reset">Vrati na nulu</button>
<p class="note">Primjeri: 55 = 0.0.55 · 128 = 0.1.0 · 380 = 0.2.124. Nakon prvog učitavanja radi i bez interneta.</p>
</main>

<script>
let value='0';
const display=document.getElementById('preset');
const error=document.getElementById('error');
const keypad=document.getElementById('keypad');
const done=document.getElementById('done');
const showKeypad=document.getElementById('showKeypad');

function render(){
  display.textContent=value;
  const n=Number(value);
  const a=Math.floor(n/16384);
  const b=Math.floor(n/128)%128;
  const c=n%128;
  document.getElementById('combined').textContent=[a,b,c].join('.');
  document.getElementById('msb').textContent=a;
  document.getElementById('lsb').textContent=b;
  document.getElementById('pc').textContent=c;
  error.textContent='';
}

function addDigit(d){
  const next=value==='0'?d:value+d;
  if(next.length>4 || Number(next)>9999){
    error.textContent='Najveći dozvoljeni broj je 9999.';
    return;
  }
  value=next || '0';
  render();
}

document.querySelectorAll('[data-digit]').forEach(btn=>{
  btn.addEventListener('click',()=>addDigit(btn.dataset.digit));
});

document.getElementById('backspace').addEventListener('click',()=>{
  value=value.length>1?value.slice(0,-1):'0';
  render();
});

document.getElementById('clear').addEventListener('click',()=>{
  value='0';
  render();
});

document.getElementById('reset').addEventListener('click',()=>{
  value='0';
  render();
  keypad.hidden=false;
  done.hidden=false;
  showKeypad.hidden=true;
});

done.addEventListener('click',()=>{
  keypad.hidden=true;
  done.hidden=true;
  showKeypad.hidden=false;
});

showKeypad.addEventListener('click',()=>{
  keypad.hidden=false;
  done.hidden=false;
  showKeypad.hidden=true;
});

document.getElementById('copy').addEventListener('click',async()=>{
  const n=Number(value);
  const v=[
    Math.floor(n/16384),
    Math.floor(n/128)%128,
    n%128
  ].join('.');
  const btn=document.getElementById('copy');
  try{
    await navigator.clipboard.writeText(v);
    btn.textContent='Kopirano: '+v;
  }catch(_){
    btn.textContent=v;
  }
  setTimeout(()=>btn.textContent='Kopiraj MIDI vrijednosti',1800);
});

render();

if('serviceWorker' in navigator){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
