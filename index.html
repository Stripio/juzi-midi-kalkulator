<!doctype html>
<html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3157d5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Juzi MIDI"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>JuziSound MIDI kalkulator</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px 14px;background:#f2f3f7;color:#171923;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:100%;max-width:500px;background:white;border-radius:22px;padding:23px;box-shadow:0 8px 28px #18213b18}h1{font-size:25px;margin:0 0 8px}.sub,.note{color:#626779;font-size:14px;line-height:1.45}label{display:block;font-weight:700;margin:22px 0 8px}.entry{display:flex;gap:9px}input{min-width:0;flex:1;text-align:center;font-size:32px;font-weight:700;padding:12px;border:1px solid #bbc2d3;border-radius:13px}button{border:0;border-radius:13px;padding:13px 15px;font-weight:700;background:#e8ecfa;color:#2345b5}.result{margin-top:17px;background:#eef2ff;border-radius:17px;padding:18px;text-align:center}.caption{font-size:12px;font-weight:700;color:#555f7b}.code{font-size:42px;font-weight:850;color:#2345b5;margin:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cell{background:white;border-radius:12px;padding:12px 4px}.cell b{display:block;font-size:27px}.cell span{font-size:11px;color:#626779}.action{display:block;width:100%;margin-top:12px;padding:15px;background:#3157d5;color:white;font-size:16px}.secondary{background:#e8ecfa;color:#2345b5}.error{color:#b42318;font-size:13px;min-height:18px;margin-top:6px}.note{font-size:12px;margin-top:16px}
@media(prefers-color-scheme:dark){body{background:#11131a;color:#f4f5f8}.card{background:#20232d}.sub,.note,.cell span{color:#b5bac9}input{background:#171a22;color:white;border-color:#51576a}.result{background:#202e55}.caption{color:#c0cbed}.code{color:#b9c9ff}.cell{background:#292d39}.secondary{background:#303b59;color:#d0dcff}}
</style></head><body><main class="card"><h1>JuziSound MIDI kalkulator</h1><p class="sub">Unesi broj preseta (0–9999) za Korg PA4X External.</p><label for="preset">Broj preseta</label><div class="entry"><input id="preset" value="0" inputmode="numeric" pattern="[0-9]*" autocomplete="off"><button id="done">Gotovo</button></div><div class="error" id="error"></div><section class="result"><div class="caption">MIDI poruka · MSB . LSB . Program</div><div class="code" id="combined">0.0.0</div><div class="grid"><div class="cell"><b id="msb">0</b><span>1. pozicija · MSB</span></div><div class="cell"><b id="lsb">0</b><span>2. pozicija · LSB</span></div><div class="cell"><b id="pc">0</b><span>3. pozicija · Program</span></div></div></section><button class="action" id="copy">Kopiraj MIDI vrijednosti</button><button class="action secondary" id="clear">Vrati na nulu</button><p class="note">Primjeri: 55 = 0.0.55 · 128 = 0.1.0 · 380 = 0.2.124. Nakon prvog učitavanja radi i bez interneta.</p></main>
<script>
const i=document.getElementById('preset'),e=document.getElementById('error');
function calc(){let s=i.value.trim(),n=s===''?NaN:Number(s);if(!Number.isInteger(n)||n<0||n>9999){e.textContent='Unesi cijeli broj od 0 do 9999.';['combined','msb','lsb','pc'].forEach(id=>document.getElementById(id).textContent='—');return null;}e.textContent='';let a=Math.floor(n/16384),b=Math.floor(n/128)%128,c=n%128;document.getElementById('combined').textContent=[a,b,c].join('.');document.getElementById('msb').textContent=a;document.getElementById('lsb').textContent=b;document.getElementById('pc').textContent=c;return [a,b,c];}
i.addEventListener('input',calc);i.addEventListener('focus',()=>{if(i.value==='0')i.select()});document.getElementById('done').onclick=()=>i.blur();document.getElementById('clear').onclick=()=>{i.value='0';calc();i.focus();i.select()};document.getElementById('copy').onclick=async()=>{let v=calc();if(!v)return;let b=document.getElementById('copy');try{await navigator.clipboard.writeText(v.join('.'));b.textContent='Kopirano: '+v.join('.')}catch(_){b.textContent=v.join('.')}setTimeout(()=>b.textContent='Kopiraj MIDI vrijednosti',1800)};calc();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
